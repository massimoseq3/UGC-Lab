<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- logo-192.png, not the 1000×1000 logo.png master: the mark is never
         drawn larger than 48 CSS px anywhere in the app, and the full-size
         file is 576 KB — a fifth of the entire JS bundle, fetched on every
         cold load and decoded to a ~4 MB bitmap for a 20px menu-bar glyph.
         Regenerate with: sips -Z 192 public/logo.png --out public/logo-192.png -->
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <!-- Installed to a phone's home screen, UGC OS runs as ONE app, not as a
         Safari tab per page. Without a manifest, iOS gives a web clip a scope
         of the exact start URL it was saved at — so the first in-app route
         change (Dashboard → Outliers) reads as leaving the app and Safari
         pops its in-app browser chrome over the top: the URL, a back chevron
         and a reload. `scope: "/"` covers every route the router can push, and
         `display: standalone` is what drops the browser chrome in the first
         place. `apple-mobile-web-app-capable` is the same instruction for
         older iOS, which ignores the manifest's display mode. The status bar
         is `black`, NOT `black-translucent`: translucent hands the app the
         status bar's own strip, and the menu bar is `fixed top-0` at 36px, so
         the clock and the battery would sit on top of it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="UGC OS" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale=1 is what lets fields render at their designed size on a
         phone. iOS Safari zooms the page in whenever a focused field's font-size
         is under 16px and never zooms back out; capping the scale stops that
         automatic zoom. It does NOT take pinch-zoom away — Safari has ignored
         scale caps for user-initiated gestures since iOS 10 — so the
         accessibility escape hatch stays. See the field rule in index.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=DM+Sans:wght@500;600;700&family=Fraunces:ital,opsz,wght@1,14..144,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>UGC OS</title>
    <script>
      // Set the theme before first paint so light-mode users don't get a dark
      // flash (and vice versa). Mirrors stores/themeStore.ts — same key.
      try {
        var pref = localStorage.getItem('ai-ugc-lab-theme') || 'dark'
        var resolved = pref === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref
        document.documentElement.dataset.theme = resolved === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
